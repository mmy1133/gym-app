<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ジムゲーム"><meta name="theme-color" content="#fff3f8"><meta name="robots" content="noindex,nofollow">
<title>ジム習慣ゲーム</title>
<style>
:root{color-scheme:light dark;--bg:#fff3f8;--card:#fff;--tx:#4a3b47;--mut:#9a8a96;--pk:#ff9ec4;--bl:#a5d4ff;--gr:#a8e6cf;--bd:#f3d9e6;--warn:#fff1c9;--cardt:rgba(255,255,255,.3);--cardh:rgba(255,255,255,.26);--tsh:0 0 5px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9);--bgd:rgba(255,243,248,.5);--pgl:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,224,240,.16));--gbg:linear-gradient(165deg,#ffe0f0,#ecdcff 50%,#ffdcec);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2230;--card:#3a2f42;--tx:#f5e9f1;--mut:#b9a8b4;--bd:#54445e;--warn:#5a4a22;--pk:#d9709c;--bl:#5a8fc0;--gr:#4f9a80;--cardt:rgba(58,47,66,.32);--cardh:rgba(58,47,66,.3);--tsh:0 0 5px rgba(30,20,40,.95),0 0 2px rgba(30,20,40,.9);--bgd:rgba(42,34,48,.55);--pgl:linear-gradient(180deg,rgba(82,66,94,.38),rgba(58,47,66,.26));--gbg:linear-gradient(165deg,#3a2740,#2d2640 50%,#3a2735)}}
:root[data-theme="dark"]{--bg:#2a2230;--card:#3a2f42;--tx:#f5e9f1;--mut:#b9a8b4;--bd:#54445e;--warn:#5a4a22;--pk:#d9709c;--bl:#5a8fc0;--gr:#4f9a80;--cardt:rgba(58,47,66,.32);--cardh:rgba(58,47,66,.3);--tsh:0 0 5px rgba(30,20,40,.95),0 0 2px rgba(30,20,40,.9);--bgd:rgba(42,34,48,.55);--pgl:linear-gradient(180deg,rgba(82,66,94,.38),rgba(58,47,66,.26));--gbg:linear-gradient(165deg,#3a2740,#2d2640 50%,#3a2735)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:84px}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px}.row>*{flex:1}
.warn{background:var(--warn);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
button{font:inherit;border:0;border-radius:16px;padding:12px 14px;background:var(--pk);color:#3a2433;font-weight:700;min-height:46px}
button.sub{background:var(--bl)}button.gr{background:var(--gr)}button.line{background:transparent;border:2px solid var(--bd);color:var(--tx)}
textarea{width:100%;height:150px;border:2px solid var(--bd);border-radius:14px;padding:10px;font:13px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--bd)}
nav button{flex:1;padding:8px 1px;font-size:10.5px;background:transparent;color:var(--mut);min-height:48px}
nav button.on{background:var(--pk);color:#3a2433}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.grid b{font-size:12px;color:var(--mut)}
.d{padding:0;min-height:44px;background:var(--bg);color:var(--tx);border-radius:12px;font-weight:600}
.d.g{background:var(--pk);color:#3a2433}.d.o{background:var(--bl);color:#1f2f40}.d.s{outline:3px solid var(--tx)}
.leg{display:flex;gap:12px;font-size:12px;margin-top:8px;color:var(--mut)}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-1px;margin-right:4px}
.rec{border-top:1px dashed var(--bd);padding:8px 0}
.toast{background:var(--gr);color:#1f3a2e;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.ok{color:#2e9b6a}.ng{color:#d0485f}
.bgm .card,.bgm .warn,.bgm .toast{background:var(--cardh);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.bgs .card,.bgs .warn{background:var(--cardt);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.bgm h1,.bgs h1{display:inline-block;background:var(--cardt);padding:2px 14px;border-radius:14px}
.bgm .mut,.bgs .mut{color:var(--tx);opacity:.78}
.bgm .mny{display:none}
.bgm,.bgs,.gch{text-shadow:var(--tsh)}
.gch .card{background:var(--pgl);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 4px 16px rgba(220,150,220,.25)}
.bgm .card,.bgm .warn,.bgs .card,.bgs .warn{border-color:rgba(255,255,255,.3)}
:root{--A:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 86px)}
@supports (height:100svh){:root{--A:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 86px)}}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>

<input type="file" id="f1" accept="image/*" style="display:none" onchange="const a=[...this.files];this.value='';addFiles(a,tgt)">
<input type="file" id="fp" accept="image/*" style="display:none" onchange="const a=[...this.files];this.value='';pfImgSet(a[0])">
<input type="file" id="fb" accept="image/*" style="display:none" onchange="const a=[...this.files];this.value='';bnSet(a[0])">
