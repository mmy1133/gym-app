<script>
const BNR={ch:'',it:''};
const K='gymgame_v1',MS={3:3000,5:5000,8:18000,10:10000},LB={3:50,5:100,7:200},BM2=1.54*1.54,SWIM=/水泳|スイミング|プール|アクア|水中|泳/,STR=/筋トレ|筋力|ウェイト|ダンベル|バーベル|スクワット|ベンチプレス|デッドリフト|レッグプレス|ラットプル|チェストプレス|腕立て|腹筋|懸垂/;
const dayD=k=>(S.weights[k]!=null?10:0)+((S.daily[k]||{}).s?20:0)+((S.daily[k]||{}).e?30:0);
let S=null,stOK=true,loadErr='',tab='home',toast='',pending=null,restoreData=null,sel=null,msgTxt='';
let now=new Date();const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let cm=ymd(now).slice(0,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>n.toLocaleString('ja-JP')+'円',pts=n=>n.toLocaleString('ja-JP')+'pt';
function load(){let raw=null;try{raw=localStorage.getItem(K)}catch(e){stOK=false}
 if(raw){try{S=JSON.parse(raw)}catch(e){S=null;loadErr='保存データを読み込めませんでした。壊れたデータは別の枠に退避したので、バックアップがあれば「保存」タブから復元してください。';try{localStorage.setItem(K+'_corrupt',raw)}catch(e2){}}}
 if(!S||typeof S!=='object'||Array.isArray(S))S={v:1,gen:2,records:{},spend:{yen:0,pt:0},tickets:0,lastBackup:null};norm();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function norm(){if(!S.records||typeof S.records!=='object'||Array.isArray(S.records))S.records={};S.login=S.login&&Array.isArray(S.login.dates)?{dates:S.login.dates}:{dates:[]};S.spend=S.spend&&typeof S.spend==='object'?S.spend:{yen:0,pt:0};S.spend.yen=+S.spend.yen||0;S.spend.pt=+S.spend.pt||0;S.spend.tickets=S.spend.tickets||0;S.tickets=S.tickets||0;S.owned=S.owned||{};S.shop=S.shop&&S.shop.products?S.shop:{products:{},seq:0};S.shop.seq=S.shop.seq||0;S.rooms=S.rooms&&Array.isArray(S.rooms.list)?S.rooms:{list:[],seq:0,sel:null};S.rooms.seq=S.rooms.seq||0;S.weights=S.weights||{};S.daily=S.daily||{};for(const k in S.owned){const m=/^CH(\d+)$/.exec(k);if(m&&CH[m[1]-1])S.owned[k].n=chFull(m[1]-1)}delete S.missions}
function save(){try{localStorage.setItem(K,JSON.stringify(S));stOK=true}catch(e){stOK=false}}
// 残高は「運動記録」から毎回計算(編集・削除しても矛盾しない)
function calc(recs){
 const days={};
 for(const r of Object.values(recs)){if(!r||!Array.isArray(r.activities)||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))continue;const d=days[r.date]=days[r.date]||{gym:false,gm:0,pt:0,recs:[]};
  d.recs.push(r);if(r.gym){d.gym=true;d.gm+=r.gymMinutes||0}
  for(const a of r.activities)d.pt+=(+a.mets||0)*(+a.minutes||0)}
 let y=0,p=0;const month={};
 Object.keys(days).sort().forEach(k=>{const d=days[k];d.pt=Math.floor(d.pt+1e-9);p+=d.pt;d.yen=0;
  if(d.gym){const m=k.slice(0,7);month[m]=(month[m]||0)+1;const n=month[m];d.n=n;
   d.yen=Math.min(d.gm,120)*25+2500+500+(MS[n]||0)}
  y+=d.yen});
 let tk=S.tickets,mp=0;const weeks={};
 const wk=k=>{const[a,b,c]=k.split('-').map(Number),t=new Date(a,b-1,c);t.setDate(t.getDate()-(t.getDay()+6)%7);return ymd(t)};
 for(const k of Object.keys(days)){const d=days[k];d.min=d.recs.reduce((s,r)=>s+r.activities.reduce((u,x)=>u+x.minutes,0),0);
  d.mpt=dayD(k);d.sw=d.recs.some(r=>r.activities.some(a=>SWIM.test(a.name||'')));d.st=d.recs.some(r=>r.activities.some(a=>STR.test(a.name||'')));
  const w=weeks[wk(k)]=weeks[wk(k)]||{ex:0,gym:0,sw:0,st:0};w.ex++;if(d.gym)w.gym++;if(d.sw)w.sw++;if(d.st)w.st++}
 for(const w of Object.values(weeks)){w.pt=(w.gym>=2?150:0)+(w.sw>=1?100:0)+(w.st>=1?100:0);w.tk=w.ex>=3?5:0;mp+=w.pt;tk+=w.tk}
 for(const k of new Set([...Object.keys(S.daily),...Object.keys(S.weights)]))mp+=dayD(k);const L=S.login.dates.length;let lp=0;for(let i=1;i<=L;i++){const q=(i-1)%7+1;lp+=20+(LB[q]||0);if(q===7)tk+=5}
 return{days,weeks,wk,yen:y-S.spend.yen,pt:p+mp+lp-S.spend.pt,tickets:tk-S.spend.tickets,mp,lp,month}}
function chk(r){
 if(!r||typeof r!=='object')return'記録の形式が違います';
 if(!r.id||typeof r.id!=='string')return'id がありません';
 if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))return r.id+': date は 2026-11-20 の形式にしてください';
 if(isNaN(new Date(r.date+'T00:00:00'))||ymd(new Date(r.date+'T00:00:00'))!==r.date)return r.id+': date が実在しない日付です';
 if(!Array.isArray(r.activities)||!r.activities.length)return r.id+': activities がありません';
 for(const a of r.activities){if(!(a.minutes>0)||!(a.mets>0))return r.id+': minutes と mets は0より大きい数字にしてください'}
 if(r.gym&&!(r.gymMinutes>=0))r.gymMinutes=r.activities.reduce((s,a)=>s+a.minutes,0);
 return null}
function sample(){return JSON.stringify({records:[{id:ymd(now).replace(/-/g,'')+'-1',date:ymd(now),gym:true,gymMinutes:45,activities:[{name:'ジム 有酸素',minutes:25,mets:5},{name:'筋トレ',minutes:20,mets:3.5}]},{id:ymd(now).replace(/-/g,'')+'-2',date:ymd(now),gym:false,activities:[{name:'ウォーキング',minutes:20,mets:3}]}]},null,1)}
function doPrev(){
 let j;try{j=JSON.parse($('#imp').value)}catch(e){return setPv('<div class="card ng">JSONの形式が正しくありません。ChatGPTの出力をそのまま貼ってください。</div>')}
 const arr=Array.isArray(j)?j:j.records?j.records:[j];const bad=[],list=[];
 for(const r of arr){const e=chk(r);e?bad.push(e):list.push(r)}
 if(bad.length)return setPv('<div class="card ng">取り込めません:<br>'+bad.map(esc).join('<br>')+'</div>');
 const merged={...S.records};let h='',nw=0;pending=[];
 for(const r of list){const o=S.records[r.id];
  if(o&&JSON.stringify(o)===JSON.stringify(r)){h+=`<div class="rec mut">取り込み済み(スキップ): ${esc(r.id)}</div>`;continue}
  merged[r.id]=r;pending.push(r);nw++;
  h+=`<div class="rec">${o?'更新':'新規'} ${esc(r.date)} ${r.gym?'ジム'+r.gymMinutes+'分':'ジム以外'}<br><span class="mut">${r.activities.map(a=>esc(a.name||'運動')+a.minutes+'分(METs '+a.mets+')').join(' / ')}</span></div>`}
 const b=calc(S.records),a=calc(merged);
 h=`<div class="card"><h2>取り込みプレビュー</h2>${h}<p>お給料 ${yen(b.yen)} → <b>${yen(a.yen)}</b>(${a.yen-b.yen>=0?'+':''}${(a.yen-b.yen).toLocaleString()})<br>ポイント ${pts(b.pt)} → <b>${pts(a.pt)}</b>(${a.pt-b.pt>=0?'+':''}${(a.pt-b.pt).toLocaleString()}・ミッション報酬を含む)<br>ガチャ券 ${b.tickets}枚 → <b>${a.tickets}枚</b></p>${nw?'<button class="gr" style="width:100%" onclick="doImp()">この内容で確定する</button>':'<p class="mut">新しく取り込む記録はありません。</p>'}</div>`;
 setPv(h)}
function setPv(h){$('#pv').innerHTML=h}
function doImp(){if(!pending||!pending.length)return;
 const bk=JSON.stringify(S);for(const r of pending)S.records[r.id]=r;save();pending=null;
 toast=stOK?'取り込みました!':'';tab='home';R()}
function del(id){S.records[id]&&(delete S.records[id],save(),toast='削除しました(残高も自動で戻りました)',R())}
function edit(id){tab='imp';pending=null;R();$('#imp').value=JSON.stringify({records:[S.records[id]]},null,1)}
function recv(){const t=ymd(now);if(S.login.dates.includes(t))return;S.login.dates.push(t);save();const q=(S.login.dates.length-1)%7+1;toast='ログインボーナス '+q+'回目！ +'+(20+(LB[q]||0))+'pt'+(q===7?' とガチャ券5枚':'');R()}
function loginCard(){const t=ymd(now),got=S.login.dates.includes(t),L=S.login.dates.length,dn=got?(L-1)%7+1:L%7,nq=L%7+1,rw=(20+(LB[nq]||0))+'pt'+(nq===7?'+ガチャ券5枚':'');
 const st=[1,2,3,4,5,6,7].map(q=>`<div style="flex:1;text-align:center;padding:6px 0;border-radius:12px;background:${q<=dn?'var(--pk)':'var(--bg)'};font-size:12px;${q<=dn?'color:#3a2433;':''}">${q<=dn?'✔':q}<br><span style="font-size:10px">${20+(LB[q]||0)}</span></div>`).join('');
 return`<div class="card"><h2>🎁 ログインボーナス</h2><div style="display:flex;gap:4px;margin-bottom:8px">${st}</div><p class="mut" style="margin:0 0 8px">${got?'本日は受け取り済み。次は'+nq+'回目: '+rw:'今日は'+nq+'回目: '+rw+' がもらえます'}(7回で1周)</p><button class="${got?'line':''}" style="width:100%" ${got?'disabled':''} onclick="recv()">${got?'受け取り済み ✔':'受け取る'}</button></div>`}
const GEN={ch:'キャラクター',fu:'家具・インテリア',za:'雑貨・小物',fa:'ファッション',ot:'その他'},PFX={ch:'CH',fu:'FU',za:'ZA',fa:'FA'};
const CH=['ハローキティ','マイメロディ','クロミ','シナモロール','ポムポムプリン','ポチャッコ','けろけろけろっぴ','タキシードサム','ハンギョドン','バッドばつ丸','ウサハナ','キキとララ','ぐでたま','あひるのペックル','マロンクリーム','チャーミーキティ','ミミィ','ディアダニエル','こぎみゅん','ウィッシュミーメル','リラックマ','コリラックマ','キイロイトリ','チャイロイコグマ','しろくま','ねこ','とんかつ','えびふらいのしっぽ','とかげ','ざっそう','ふろしき','たぴおか','ほこり','にせつむり'];
const ADJ=['ふわふわ','いちご','ミルキー','パステル','ゆめかわ','はちみつ','もこもこ','さくら','ほしぞら','マシュマロ','レモン','ひみつの'];
const NN={fu:['ソファ','ベッド','テーブル','チェア','ラグ','カーテン','本棚','ランプ','クッション','ドレッサー','スツール','チェスト'],za:['マグカップ','ぬいぐるみ','ポーチ','フォトフレーム','キャンドル','ミラー','ブランケット','ステッカー','ノート','ハンカチ','キーホルダー','オルゴール'],fa:['リボン','ワンピース','ベレー帽','マフラー','カーディガン','スカート','ポシェット','パジャマ','スニーカー','ヘアピン','エプロン','ソックス']};
let gSel='ch',gMode='pt',gRes=[],gMsg='';
const p2=n=>String(n).padStart(2,'0');
const SER=i=>i<20?'サンリオ':i<24?'リラックマ':'すみっコぐらし';
const chFull=i=>CH[i]+'（'+SER(i)+'）';
function missing(){const l=CH.map((x,i)=>['CH'+p2(i+1),chFull(i)]).filter(([id])=>!S.owned[id]);return l.length?`<details style='margin-top:8px'><summary class='mut'>未入手(${l.length}体)</summary>${l.map(([id,n])=>`<div class='rec mut'>${esc(n)}</div>`).join('')}</details>`:'<p class="mut">🎉 コンプリート！</p>'}
function pick(g,taken){
 if(g==='ch'){const l=CH.map((x,i)=>({id:'CH'+p2(i+1),n:chFull(i),g})).filter(o=>!S.owned[o.id]&&!taken.has(o.id));return l[Math.floor(Math.random()*l.length)]}
 for(let k=0;k<30;k++){const a=Math.floor(Math.random()*ADJ.length),b=Math.floor(Math.random()*NN[g].length),id=PFX[g]+p2(a+1)+p2(b+1);if(!taken.has(id)||k===29)return{id,n:ADJ[a]+NN[g][b],g}}}
const chLeft=()=>CH.length-Object.keys(S.owned).filter(k=>/^CH/.test(k)).length;
function roll(n){const c=calc(S.records);gRes=[];gMsg='';
 const isCh=gSel==='ch';if(isCh&&n>1)return R();const mode=isCh?'pt':gMode,cost=isCh?1000:100*n;
 if(mode==='pt'?c.pt<cost:c.tickets<n){gMsg=mode==='pt'?'ポイントが足りません(必要 '+cost+'pt)':'ガチャ券が足りません(必要 '+n+'枚)';return R()}
 if(gSel==='ch'&&chLeft()<n){gMsg=chLeft()?'残りキャラは'+chLeft()+'体です。回数を減らしてください':'全キャラクターをコンプリート！';return R()}
 const taken=new Set();
 for(let i=0;i<n;i++){const o=pick(gSel,taken);taken.add(o.id);const had=S.owned[o.id];if(!had)S.owned[o.id]={n:o.n,g:o.g,c:0};S.owned[o.id].c++;gRes.push({n:o.n,nw:!had,id:o.id})}
 if(mode==='pt')S.spend.pt+=cost;else S.spend.tickets+=n;
 save();R()}
let iSel='fu',gArea='ch';
const BPK="width:100%;min-height:58px;border-radius:999px;font-size:20px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(200,60,120,.6);background:linear-gradient(180deg,#ffb3d4,#f06aa8);border:2px solid #f4d58d;box-shadow:0 3px 10px rgba(240,106,168,.45),inset 0 2px 4px rgba(255,255,255,.6)";
const BLV="width:100%;min-height:54px;border-radius:999px;font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(120,80,190,.6);background:linear-gradient(180deg,#f3b6e6,#b9a1f0);border:2px solid #f4d58d;box-shadow:0 3px 10px rgba(160,130,230,.4),inset 0 2px 4px rgba(255,255,255,.6)";
const bnSrc=k=>IMG['BN_'+k]||BNR[k]||'';
const GP=t=>{const s=bnSrc(t),ti=t==='ch'?'キャラクターガチャ':'アイテムガチャ';return s?`<img src='${s}' alt='' style='width:100%;height:auto;display:block;border-radius:18px' onerror="this.replaceWith(Object.assign(document.createElement('h2'),{textContent:'${ti}',style:'text-align:center'}))">`:`<h2 style='text-align:center;margin:8px 0'>${ti}</h2>`};
let bnT='ch';
async function bnSet(f){if(!f)return;try{const d=await shrink(f,1080);await idbSet('BN_'+bnT,d);IMG['BN_'+bnT]=d;toast='バナーを登録しました'}catch(e){toast=QMSG}R()}
async function bnDel(){try{await idbSet('BN_ch',null);await idbSet('BN_it',null);delete IMG.BN_ch;delete IMG.BN_it;toast='登録したバナーを外しました'}catch(e){toast=QMSG}R()}
function rollCh(){gSel='ch';gArea='ch';roll(1)}

function idb(){return new Promise(r=>{try{const q=indexedDB.open('gymgame_img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i');q.onsuccess=()=>{db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})}
function idbAll(){return new Promise(r=>{if(!db)return r({});const o={},q=db.transaction('i').objectStore('i').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else r(o)};q.onerror=()=>r({})})}
function idbSet(k,v){return new Promise((res,rej)=>{if(!db)return rej(new Error('nodb'));const t=db.transaction('i','readwrite');v===null?t.objectStore('i').delete(k):t.objectStore('i').put(v,k);t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)})}

function shrink(f,mx=360){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{const s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82))};im.src=fr.result};fr.readAsDataURL(f)})}

 if(m){const id=((m[1]||m[3])+(m[2]||m[4])).toUpperCase();if(S.owned[id])return id}

async function bulkDo(){if(!bp||bp.dup.length||!bp.n)return;let ok=0,ng=0;const ku=[],ks=[],kn=[];

  if(id){try{await idbSet(id,unm[k]);IMG[id]=unm[k];ok++;continue}catch(e){ng++}}

 return h}
